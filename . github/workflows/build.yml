name: Build Base APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag Release GitHub yang berisi ZIP"
        required: true
        type: string
      asset_name:
        description: "Nama ZIP, misalnya Base biasa.zip atau Base kontrol.zip"
        required: true
        type: string
      build_type:
        description: "Jenis project"
        required: true
        type: choice
        options: [auto, android, webview]
        default: auto

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses + install build-tools
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/tmp/sdk-licenses.log 2>&1 || true
          sdkmanager "build-tools;35.0.0" "platform-tools" >/tmp/sdk-install.log 2>&1 || \
            sdkmanager "build-tools;34.0.0" "platform-tools" >/tmp/sdk-install.log 2>&1 || true
          echo "Android SDK siap. build-tools:"
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" 2>/dev/null || true

      - name: Download ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ inputs.asset_name }}" --clobber
          unzip -q "${{ inputs.asset_name }}" -d src

      - name: Detect
        id: detect
        shell: bash
        run: |
          set -e
          T="${{ inputs.build_type }}"
          if [ "$T" = auto ]; then
            if find src -name gradlew -type f -print -quit | grep -q .; then T=android
            elif find src -name "*.html" -type f -print -quit | grep -q .; then T=webview
            else
              echo "::error::Project Android/WebView tidak ditemukan."
              exit 1
            fi
          fi
          echo "type=$T" >> "$GITHUB_OUTPUT"

      - name: Build native Android
        if: steps.detect.outputs.type == 'android'
        shell: bash
        run: |
          set -e
          ROOT="$(dirname "$(find src -name gradlew -type f -print -quit)")"
          cd "$ROOT"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$(find app/build/outputs/apk/release -name '*.apk' -print -quit)" \
             "$GITHUB_WORKSPACE/output/app-release-unsigned.apk"

      - name: Build WebView wrapper
        if: steps.detect.outputs.type == 'webview'
        shell: bash
        run: |
          set -e
          # Cari file HTML entry (prioritas nama umum)
          HTML=""
          for name in index.html dashboard.html splash.html home.html main.html app.html; do
            HTML="$(find src -type f -name "$name" -print -quit)"
            [ -n "$HTML" ] && break
          done
          [ -n "$HTML" ] || HTML="$(find src -type f -name '*.html' -print -quit)"
          [ -n "$HTML" ] || { echo "::error::File HTML tidak ditemukan di ZIP."; find src -maxdepth 3 -type f | head -50; exit 1; }
          echo "[WEBVIEW] HTML entry: $HTML"

          mkdir -p web/app/src/main/java/com/tirzz/webview \
                   web/app/src/main/res/values \
                   web/app/src/main/assets

          # Salin seluruh isi folder tempat HTML berada ke assets
          HTML_DIR="$(dirname "$HTML")"
          cp -a "$HTML_DIR"/. web/app/src/main/assets/

          # Pastikan index.html ADA di root assets (MainActivity load path ini)
          ENTRY_NAME="$(basename "$HTML")"
          if [ ! -f web/app/src/main/assets/index.html ]; then
            if [ -f "web/app/src/main/assets/$ENTRY_NAME" ]; then
              cp "web/app/src/main/assets/$ENTRY_NAME" web/app/src/main/assets/index.html
              echo "[WEBVIEW] Rename/copy $ENTRY_NAME → index.html"
            else
              # HTML mungkin di subfolder assets setelah copy
              FOUND_IDX="$(find web/app/src/main/assets -type f -name index.html -print -quit)"
              FOUND_ANY="$(find web/app/src/main/assets -type f -name '*.html' -print -quit)"
              if [ -n "$FOUND_IDX" ]; then
                cp "$FOUND_IDX" web/app/src/main/assets/index.html
                echo "[WEBVIEW] Promote $FOUND_IDX → assets/index.html"
              elif [ -n "$FOUND_ANY" ]; then
                cp "$FOUND_ANY" web/app/src/main/assets/index.html
                echo "[WEBVIEW] Promote $FOUND_ANY → assets/index.html"
              else
                echo "::error::[WEBVIEW] Tidak ada HTML di assets setelah copy."
                find web/app/src/main/assets -type f | head -40
                exit 1
              fi
            fi
          fi

          echo "[WEBVIEW] Isi assets (max 40 file):"
          find web/app/src/main/assets -type f | head -40
          test -f web/app/src/main/assets/index.html
          echo "[WEBVIEW] index.html size: $(wc -c < web/app/src/main/assets/index.html) bytes"

          # App label dari folder / nama file bila ada
          APP_LABEL="Web App"
          if [ -f web/app/src/main/assets/app_name.txt ]; then
            APP_LABEL="$(head -1 web/app/src/main/assets/app_name.txt | tr -d '\r')"
          fi

          # Cari file icon/logo di dalam ZIP (dipakai sebagai ikon aplikasi/launcher)
          ICON=""
          for pattern in icon.png logo.png app_icon.png ic_launcher.png favicon.png; do
            ICON="$(find src -type f -iname "$pattern" -print -quit)"
            [ -n "$ICON" ] && break
          done
          if [ -z "$ICON" ]; then
            ICON="$(find src -type f \( -iname '*icon*.png' -o -iname '*logo*.png' \) -print -quit)"
          fi

          mkdir -p web/app/src/main/res/mipmap-mdpi web/app/src/main/res/mipmap-hdpi \
                   web/app/src/main/res/mipmap-xhdpi web/app/src/main/res/mipmap-xxhdpi \
                   web/app/src/main/res/mipmap-xxxhdpi

          which convert >/dev/null 2>&1 || sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick >/tmp/imagemagick.log 2>&1 || true

          if [ -n "$ICON" ] && command -v convert >/dev/null 2>&1; then
            echo "[ICON] Pakai icon dari ZIP: $ICON"
            convert "$ICON" -resize 48x48   web/app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert "$ICON" -resize 72x72   web/app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert "$ICON" -resize 96x96   web/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert "$ICON" -resize 144x144 web/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert "$ICON" -resize 192x192 web/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          else
            echo "::warning::[ICON] Tidak ada icon.png/logo.png di ZIP, membuat ikon default otomatis."
            INIT="$(echo "$APP_LABEL" | cut -c1 | tr '[:lower:]' '[:upper:]')"
            [ -n "$INIT" ] || INIT="A"
            for size_name in "48x48:mdpi" "72x72:hdpi" "96x96:xhdpi" "144x144:xxhdpi" "192x192:xxxhdpi"; do
              SZ="${size_name%%:*}"; DPI="${size_name##*:}"
              PS="$(echo "$SZ" | cut -d'x' -f1)"
              convert -size "$SZ" xc:'#3F51B5' -gravity center -fill white \
                -pointsize "$((PS*2/3))" -font DejaVu-Sans-Bold -annotate 0 "$INIT" \
                "web/app/src/main/res/mipmap-$DPI/ic_launcher.png" 2>/dev/null || \
                convert -size "$SZ" xc:'#3F51B5' "web/app/src/main/res/mipmap-$DPI/ic_launcher.png"
            done
          fi

          cat > web/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > web/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name="BaseWeb"; include(":app")
          EOF

          cat > web/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF

          cat > web/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.tirzz.webview'
            compileSdk 35
            defaultConfig {
              applicationId 'com.tirzz.webview'
              minSdk 23
              targetSdk 35
              versionCode 1
              versionName '1.0'
            }
          }
          dependencies {
            implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

          cat > web/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"/>
          </resources>
          EOF

          cat > web/app/src/main/res/values/strings.xml <<EOF
          <resources>
            <string name="app_name">$APP_LABEL</string>
          </resources>
          EOF

          cat > web/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <application android:theme="@style/AppTheme"
              android:label="@string/app_name" android:icon="@mipmap/ic_launcher"
              android:usesCleartextTraffic="true">
              <activity android:name=".MainActivity" android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > web/app/src/main/java/com/tirzz/webview/MainActivity.java <<'EOF'
          package com.tirzz.webview;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.webkit.WebViewAssetLoader;
          public class MainActivity extends Activity {
            WebView w;
            WebViewAssetLoader assetLoader;
            public void onCreate(Bundle b) {
              super.onCreate(b);
              // WebViewAssetLoader membuat file di assets/ diakses lewat domain virtual
              // https://appassets.androidplatform.net/ , sehingga link/path ABSOLUT
              // seperti "/login.html" atau "/js/app.js" tetap ketemu filenya
              // (ini yang menyebabkan error "file:///login.html tidak ditemukan").
              assetLoader = new WebViewAssetLoader.Builder()
                  .addPathHandler("/", new WebViewAssetLoader.AssetsPathHandler(this))
                  .build();

              w = new WebView(this);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setAllowFileAccess(true);
              s.setAllowContentAccess(true);
              s.setLoadWithOverviewMode(true);
              s.setUseWideViewPort(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              w.setWebViewClient(new WebViewClient() {
                @Override
                public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                  return assetLoader.shouldInterceptRequest(request.getUrl());
                }
              });
              w.setWebChromeClient(new WebChromeClient());
              w.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              setContentView(w);
            }
            public void onBackPressed() {
              if (w != null && w.canGoBack()) w.goBack(); else super.onBackPressed();
            }
          }
          EOF

          cd web
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$(find app/build/outputs/apk/release -name '*.apk' -print -quit)" \
             "$GITHUB_WORKSPACE/output/app-release-unsigned.apk"

      - name: Sign release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e
          if [ ! -f output/app-release-unsigned.apk ]; then
            echo "::error::[SIGN] File output/app-release-unsigned.apk tidak ditemukan. Step build sebelumnya gagal?"
            ls -la output/ 2>/dev/null || true
            exit 1
          fi

          # Deteksi build-tools otomatis
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BT=""
          for cand in 35.0.0 34.0.0 33.0.2 33.0.1 33.0.0 32.0.0; do
            if [ -x "$SDK_ROOT/build-tools/$cand/zipalign" ]; then
              BT="$SDK_ROOT/build-tools/$cand"
              break
            fi
          done
          if [ -z "$BT" ]; then
            BT="$(ls -d "$SDK_ROOT"/build-tools/*/ 2>/dev/null | sort -V | tail -1 | sed 's:/*$::')"
          fi
          if [ -z "$BT" ] || [ ! -x "$BT/zipalign" ] || [ ! -x "$BT/apksigner" ]; then
            echo "::error::[SIGN] build-tools (zipalign/apksigner) tidak ditemukan di $SDK_ROOT/build-tools"
            ls -la "$SDK_ROOT/build-tools" 2>/dev/null || true
            exit 1
          fi
          echo "Memakai build-tools: $BT"

          KS_FILE="release.keystore"
          KS_PASS=""
          KS_ALIAS=""
          KEY_PASS=""

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "[SIGN] Memakai keystore dari secret repo..."
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS_FILE"
            if [ ! -s "$KS_FILE" ]; then
              echo "::error::[SIGN] KEYSTORE_BASE64 tidak valid (hasil decode kosong)."
              exit 1
            fi
            KS_PASS="$KEYSTORE_PASSWORD"
            KS_ALIAS="$KEY_ALIAS"
            KEY_PASS="$KEY_PASSWORD"
          else
            # Secret kosong → buat debug keystore otomatis.
            # APK unsigned TIDAK BISA di-install di Android ("paket tidak valid").
            echo "::warning::[SIGN] Secret keystore belum lengkap — sign dengan DEBUG keystore otomatis."
            echo "Untuk production, isi secret: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD"
            KS_PASS="android"
            KS_ALIAS="androiddebugkey"
            KEY_PASS="android"
            keytool -genkeypair -v \
              -keystore "$KS_FILE" \
              -storepass "$KS_PASS" \
              -alias "$KS_ALIAS" \
              -keypass "$KEY_PASS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Tirzz Debug,OU=Build,O=Tirzz,L=Jakarta,ST=JK,C=ID" \
              >/tmp/keytool.log 2>&1
            if [ ! -s "$KS_FILE" ]; then
              echo "::error::[SIGN] Gagal membuat debug keystore."
              cat /tmp/keytool.log 2>/dev/null || true
              exit 1
            fi
          fi

          "$BT/zipalign" -f 4 output/app-release-unsigned.apk output/aligned.apk
          "$BT/apksigner" sign \
            --ks "$KS_FILE" \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KS_ALIAS" \
            --key-pass "pass:$KEY_PASS" \
            --out output/app-release.apk output/aligned.apk
          "$BT/apksigner" verify --verbose output/app-release.apk
          rm -f "$KS_FILE" output/app-release-unsigned.apk output/aligned.apk
          echo "Sign berhasil: output/app-release.apk"
          ls -la output/app-release.apk

      - name: Upload app-release.apk
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk
          retention-days: 30
          
