name: Build Base APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag Release GitHub yang berisi ZIP"
        required: true
        type: string
      asset_name:
        description: "Nama ZIP, misalnya Base biasa.zip atau Base kontrol.zip"
        required: true
        type: string
      build_type:
        description: "Jenis project"
        required: true
        type: choice
        options: [auto, android, webview]
        default: auto

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Download ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ inputs.asset_name }}" --clobber
          unzip -q "${{ inputs.asset_name }}" -d src

      - name: Detect
        id: detect
        shell: bash
        run: |
          set -e
          T="${{ inputs.build_type }}"
          if [ "$T" = auto ]; then
            if find src -name gradlew -type f -print -quit | grep -q .; then T=android
            elif find src -name "*.html" -type f -print -quit | grep -q .; then T=webview
            else
              echo "::error::Project Android/WebView tidak ditemukan."
              exit 1
            fi
          fi
          echo "type=$T" >> "$GITHUB_OUTPUT"

      - name: Build native Android
        if: steps.detect.outputs.type == 'android'
        shell: bash
        run: |
          set -e
          ROOT="$(dirname "$(find src -name gradlew -type f -print -quit)")"
          cd "$ROOT"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$(find app/build/outputs/apk/release -name '*.apk' -print -quit)" \
             "$GITHUB_WORKSPACE/output/app-release-unsigned.apk"

      - name: Build WebView wrapper
        if: steps.detect.outputs.type == 'webview'
        shell: bash
        run: |
          set -e
          HTML="$(find src -type f -name index.html -print -quit)"
          [ -n "$HTML" ] || HTML="$(find src -type f -name dashboard.html -print -quit)"
          [ -n "$HTML" ] || HTML="$(find src -type f -name splash.html -print -quit)"
          [ -n "$HTML" ] || HTML="$(find src -type f -name '*.html' -print -quit)"
          [ -n "$HTML" ] || { echo "::error::File HTML tidak ditemukan."; exit 1; }

          mkdir -p web/app/src/main/java/com/tirzz/webview \
                   web/app/src/main/res/values \
                   web/app/src/main/assets
          cp -r "$(dirname "$HTML")"/. web/app/src/main/assets/

          cat > web/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name="BaseWeb"; include(":app")
          EOF

          cat > web/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF

          cat > web/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.tirzz.webview'
            compileSdk 35
            defaultConfig {
              applicationId 'com.tirzz.webview'
              minSdk 23
              targetSdk 35
              versionCode 1
              versionName '1.0'
            }
          }
          EOF

          cat > web/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"/>
          </resources>
          EOF

          cat > web/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:theme="@style/AppTheme"
              android:label="Universal Web App" android:usesCleartextTraffic="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > web/app/src/main/java/com/tirzz/webview/MainActivity.java <<'EOF'
          package com.tirzz.webview;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            WebView w;
            public void onCreate(Bundle b) {
              super.onCreate(b); w=new WebView(this);
              WebSettings s=w.getSettings();
              s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true);
              w.setWebViewClient(new WebViewClient());
              w.loadUrl("file:///android_asset/index.html"); setContentView(w);
            }
            public void onBackPressed() {
              if(w.canGoBack()) w.goBack(); else super.onBackPressed();
            }
          }
          EOF

          cd web
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$(find app/build/outputs/apk/release -name '*.apk' -print -quit)" \
             "$GITHUB_WORKSPACE/output/app-release-unsigned.apk"

      - name: Sign release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e
          : "${KEYSTORE_BASE64:?Secret KEYSTORE_BASE64 belum ada}"
          : "${KEYSTORE_PASSWORD:?Secret KEYSTORE_PASSWORD belum ada}"
          : "${KEY_ALIAS:?Secret KEY_ALIAS belum ada}"
          : "${KEY_PASSWORD:?Secret KEY_PASSWORD belum ada}"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          SDK="$ANDROID_HOME/build-tools/35.0.0"
          "$SDK/zipalign" -f 4 output/app-release-unsigned.apk output/aligned.apk
          "$SDK/apksigner" sign \
            --ks release.keystore \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out output/app-release.apk output/aligned.apk
          "$SDK/apksigner" verify --verbose output/app-release.apk
          rm -f release.keystore output/app-release-unsigned.apk output/aligned.apk

      - name: Upload app-release.apk
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk
          retention-days: 30
